  <rect x="8" y="16" width="1" height="3" fill="#2b1b3d"/>
  <rect x="15" y="16" width="1" height="3" fill="#2b1b3d"/>
  <rect x="9" y="19" width="1" height="2" fill="#2b1b3d"/>
