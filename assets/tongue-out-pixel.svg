  <rect x="7" y="11" width="2" height="1" fill="#2b1b3d"/>
  <rect x="5" y="12" width="2" height="1" fill="#2b1b3d"/>

  <!-- Right Eye: Cute Open Pixel Eye -->
  <rect x="15" y="9" width="3" height="4" fill="#2b1b3d"/>
