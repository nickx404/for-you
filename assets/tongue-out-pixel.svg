  <rect x="5" y="4" width="2" height="2" fill="#2b1b3d"/>
  <rect x="17" y="4" width="2" height="2" fill="#2b1b3d"/>
  <rect x="3" y="6" width="2" height="2" fill="#2b1b3d"/>
  <rect x="19" y="6" width="2" height="2" fill="#2b1b3d"/>
  <rect x="2" y="8" width="1" height="8" fill="#2b1b3d"/>
  <rect x="21" y="8" width="1" height="8" fill="#2b1b3d"/>
  <rect x="3" y="16" width="2" height="2" fill="#2b1b3d"/>
  <rect x="19" y="16" width="2" height="2" fill="#2b1b3d"/>
  <rect x="5" y="18" width="2" height="2" fill="#2b1b3d"/>
